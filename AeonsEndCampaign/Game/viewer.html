<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Whisper Below — Campaign Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #0f0e12;
    --bg2: #18171d;
    --bg3: #22212a;
    --border: #2e2c3a;
    --text: #d4d0d9;
    --text-dim: #8a8699;
    --accent: #b8865a;
    --accent2: #6b5e7a;
    --red: #a04040;
    --green: #5a8a5a;
    --gold: #c9a84c;
    --font: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    --sidebar-w: 280px;
  }

  html { height: 100%; }
  body {
    height: 100vh; display: flex; font-family: var(--font);
    background: var(--bg); color: var(--text); line-height: 1.7;
    font-size: 15px;
  }

  /* ─── Sidebar ─── */
  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 20px 18px 14px; border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 {
    font-size: 16px; font-weight: 700; color: var(--accent);
    letter-spacing: 0.5px;
  }
  #sidebar-header p {
    font-size: 11px; color: var(--text-dim); margin-top: 4px;
  }
  #sidebar-nav {
    flex: 1; overflow-y: auto; padding: 8px 0;
  }
  .nav-section {
    padding: 14px 18px 4px; font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--accent2); font-weight: 600;
  }
  .nav-item {
    display: block; padding: 6px 18px 6px 24px; cursor: pointer;
    color: var(--text-dim); font-size: 13px; text-decoration: none;
    border-left: 2px solid transparent; transition: all 0.15s;
  }
  .nav-item:hover { color: var(--text); background: var(--bg3); }
  .nav-item.active {
    color: var(--accent); border-left-color: var(--accent);
    background: var(--bg3);
  }
  .nav-item.image-item { padding-left: 32px; font-size: 12px; }
  .nav-item.image-item::before {
    content: '🖼 '; font-size: 11px;
  }

  /* ─── Content ─── */
  #content {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  #toolbar {
    padding: 10px 24px; background: var(--bg2);
    border-bottom: 1px solid var(--border); display: flex;
    align-items: center; gap: 12px; flex-shrink: 0;
  }
  #file-path {
    font-size: 12px; color: var(--text-dim); font-family: var(--font-mono);
    flex: 1;
  }
  .tb-btn {
    padding: 5px 14px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg3); color: var(--text); cursor: pointer;
    font-family: var(--font); font-size: 12px; transition: all 0.15s;
  }
  .tb-btn:hover { background: var(--border); color: #fff; }
  .tb-btn.primary { background: var(--accent); color: #1a161f; border-color: var(--accent); font-weight: 600; }
  .tb-btn.primary:hover { background: #c9976a; }
  .tb-btn.danger { color: var(--red); }
  .tb-btn.danger:hover { background: var(--red); color: #fff; }
  #edit-status {
    font-size: 11px; color: var(--gold); margin-left: auto;
  }

  #viewer {
    flex: 1; overflow-y: auto; padding: 40px 48px;
  }
  #viewer img { max-width: 100%; border-radius: 8px; margin: 12px 0; }
  #editor {
    flex: 1; display: none; flex-direction: column;
  }
  #editor textarea {
    flex: 1; resize: none; border: none; outline: none;
    padding: 24px 32px; font-family: var(--font-mono); font-size: 13px;
    line-height: 1.7; background: var(--bg); color: var(--text);
    tab-size: 2;
  }
  #editor textarea:focus { background: #131116; }

  /* ─── Markdown styling ─── */
  #viewer h1 { font-size: 28px; color: var(--accent); margin: 0 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); font-weight: 700; }
  #viewer h2 { font-size: 21px; color: var(--gold); margin: 32px 0 12px; }
  #viewer h3 { font-size: 17px; color: var(--text); margin: 24px 0 10px; }
  #viewer p { margin: 0 0 14px; }
  #viewer hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
  #viewer blockquote {
    border-left: 3px solid var(--accent); padding: 8px 16px; margin: 16px 0;
    background: var(--bg2); color: var(--text-dim); font-style: italic;
  }
  #viewer blockquote p { margin: 4px 0; }
  #viewer code {
    font-family: var(--font-mono); font-size: 13px;
    background: var(--bg3); padding: 1px 6px; border-radius: 3px;
  }
  #viewer pre code {
    display: block; padding: 16px; overflow-x: auto;
    border: 1px solid var(--border); border-radius: 6px;
  }
  #viewer table {
    border-collapse: collapse; margin: 16px 0; width: 100%;
    font-size: 14px;
  }
  #viewer th, #viewer td {
    border: 1px solid var(--border); padding: 8px 12px; text-align: left;
  }
  #viewer th { background: var(--bg3); color: var(--accent); font-weight: 600; }
  #viewer tr:nth-child(even) { background: var(--bg2); }
  #viewer ul, #viewer ol { margin: 8px 0 14px 24px; }
  #viewer li { margin: 3px 0; }
  #viewer a { color: var(--gold); }
  #viewer a:hover { color: var(--accent); }
  #viewer strong { color: #e8e4ef; }

  /* ─── Empty state ─── */
  #empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text-dim); text-align: center; padding: 40px;
  }
  #empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  #empty-state h2 { color: var(--accent2); margin-bottom: 8px; }

  /* ─── Toast ─── */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 10px 20px; border-radius: 6px; font-size: 13px;
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* ─── Scrollbar ─── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }
</style>
</head>
<body>

<!-- ─── Sidebar ─── -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>⬡ The Whisper Below</h1>
    <p>Aeon's End Campaign</p>
  </div>
  <div id="sidebar-nav"></div>
</div>

<!-- ─── Content ─── -->
<div id="content">
  <div id="toolbar">
    <span id="file-path">No file selected</span>
    <button class="tb-btn" id="btn-edit" onclick="enterEdit()" style="display:none">✎ Edit</button>
    <button class="tb-btn primary" id="btn-save" onclick="saveFile()" style="display:none">💾 Save</button>
    <button class="tb-btn danger" id="btn-cancel" onclick="cancelEdit()" style="display:none">✕ Cancel</button>
    <span id="edit-status"></span>
  </div>

  <div id="empty-state">
    <div class="icon">⬡</div>
    <h2>Select a file from the sidebar</h2>
    <p>Choose a mission, story, or world file to view. You can also browse images.</p>
  </div>

  <div id="viewer" style="display:none"></div>
  <div id="editor" style="display:none"><textarea id="editor-textarea"></textarea></div>
</div>

<div id="toast"></div>

<script>
/* ─── File tree ─── */
const FILES = [
  { section: "Story & Missions" },
  { name: "Story Overview", path: "Story.md", file: true },
  { name: "⤷ Prologue",     path: "Chapters/Prologue.md", file: true },
  { name: "⤷ Chapter 01",   path: "Chapters/Chapter 01 - The Whisper Below.md", file: true },
  { name: "Current Mission",  path: "CurrentMission.md",  file: true },
  { section: "Archived Missions" },
  { name: "⤷ Mission 01 — What the Dark Attracts", path: "Missions/Mission 01 - What the Dark Attracts.md", file: true },
  { section: "World" },
  { name: "Gravehold", path: "World/Gravehold.md", file: true },
  { name: "Locations", path: "World/Locations.md", file: true },
  { name: "NPCs",      path: "World/NPCs.md",      file: true },
  { name: "Nemeses",   path: "World/Nemeses.md",   file: true },
  { name: "Allies",    path: "World/Allies.md",    file: true },
  { name: "Relics",    path: "World/Relics.md",    file: true },
  { section: "Heroes" },
  { name: "Mage Roster",   path: "Heroes/Roster.md",       file: true },
  { name: "Retired Heroes",path: "Heroes/RetiredHeroes.md",file: true },
  { section: "Sessions" },
  { name: "S01 — What the Dark Attracts", path: "Sessions/S01 - What the Dark Attracts.md", file: true },
  { name: "Session Template",             path: "Sessions/SessionTemplate.md",               file: true },
  { section: "Images" },
  { name: "Adelheim",  path: "Images/Mages/Adelheim.png",  file: true },
  { name: "Brama",     path: "Images/Mages/Brama.png",     file: true },
  { name: "Dezmodia",  path: "Images/Mages/Dezmodia.png",  file: true },
  { name: "Kadir",     path: "Images/Mages/Kadir.png",     file: true },
  { name: "Xaxos (AE)",path: "Images/Mages/Xaxos_AE.png",  file: true },
  { name: "Rageborne", path: "Images/Nemeses/Rageborne.png",file: true },
  { name: "Councilor Sera", path: "Images/NPCs/Councilor_Sera.png", file: true },
  { name: "Kellan Voss",    path: "Images/NPCs/Kellan_Voss.png",    file: true },
];

/* ─── State ─── */
let currentPath = null;
let isEditing = false;
let originalContent = "";
const BASE = ""; // files are relative to this HTML file's location

/* ─── Init sidebar ─── */
function buildNav() {
  const nav = document.getElementById('sidebar-nav');
  for (const item of FILES) {
    if (item.section) {
      const sec = document.createElement('div');
      sec.className = 'nav-section';
      sec.textContent = item.section;
      nav.appendChild(sec);
    } else {
      const a = document.createElement('a');
      a.className = 'nav-item' + (item.image ? ' image-item' : '');
      if (item.name.startsWith('S0')) a.className += ' session-item';
      a.textContent = item.name;
      a.dataset.path = item.path;
      a.onclick = () => selectFile(item.path, a);
      nav.appendChild(a);
    }
  }
}

/* ─── Select file ─── */
async function selectFile(path, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  else document.querySelector(`.nav-item[data-path="${path}"]`)?.classList.add('active');

  currentPath = path;
  exitEdit();

  document.getElementById('empty-state').style.display = 'none';

  const isImage = /\.(png|jpg|jpeg|gif|webp)$/i.test(path);

  if (isImage) {
    document.getElementById('viewer').style.display = 'block';
    document.getElementById('viewer').innerHTML = `<img src="${BASE}${path}" alt="${path}" style="max-width:100%">`;
    document.getElementById('file-path').textContent = `📁 ${path}`;
    document.getElementById('btn-edit').style.display = 'none';
    return;
  }

  try {
    const resp = await fetch(BASE + path);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    originalContent = text;
    renderMarkdown(text);
    document.getElementById('file-path').textContent = `📄 ${path}`;
    document.getElementById('btn-edit').style.display = 'inline-block';
    document.getElementById('edit-status').textContent = '';
  } catch (e) {
    document.getElementById('viewer').style.display = 'block';
    document.getElementById('viewer').innerHTML =
      `<p style="color:var(--red)">⚠ Failed to load <code>${path}</code></p>
       <p style="color:var(--text-dim)">This viewer needs to be served over HTTP. Try:</p>
       <pre style="margin-top:12px"><code>cd AeonsEndCampaign/Game
npx serve .
# or: python -m http.server 8080
# or: npx live-server</code></pre>`;
    document.getElementById('file-path').textContent = `⚠ ${path}`;
    document.getElementById('btn-edit').style.display = 'none';
  }
}

/* ─── Render ─── */
function renderMarkdown(text) {
  document.getElementById('viewer').style.display = 'block';
  document.getElementById('editor').style.display = 'none';
  document.getElementById('viewer').innerHTML = marked.parse(text);

  // Build a set of known file paths from the sidebar for resolution
  const knownPaths = new Set(FILES.filter(f => f.file).map(f => f.path));

  // Convert <code> elements that look like local file paths into clickable links
  document.querySelectorAll('#viewer code').forEach(el => {
    const txt = el.textContent.trim();
    if (knownPaths.has(txt) || /\.(md|png|jpg|jpeg|gif|webp|yaml)$/i.test(txt)) {
      const link = document.createElement('a');
      link.textContent = txt;
      link.href = '#';
      link.className = 'file-link';
      link.onclick = makeFileClickHandler(txt);
      el.replaceWith(link);
    }
  });

  // Make all <a> links behave correctly
  document.querySelectorAll('#viewer a').forEach(a => {
    const href = a.getAttribute('href');
    if (href && !href.startsWith('http://') && !href.startsWith('https://') && !href.startsWith('#') && !a.classList.contains('file-link')) {
      a.removeAttribute('href');
      a.style.cursor = 'pointer';
      a.onclick = (e) => {
        e.preventDefault();
        const resolved = resolvePath(href);
        const navItem = document.querySelector(`.nav-item[data-path="${resolved}"]`);
        selectFile(resolved, navItem);
      };
    }
    if (a.hostname && a.hostname !== location.hostname) a.target = '_blank';
  });
}

/* ─── Path resolution ─── */
const ROOT_DIRS = ['Chapters/', 'Missions/', 'World/', 'Heroes/', 'Sessions/', 'Images/', 'Maps/', 'Rules/'];
const ROOT_FILES = ['Story.md', 'CurrentMission.md', 'README.md'];

function resolvePath(txt) {
  // Strip "Game/" prefix since the viewer lives inside Game/
  let clean = txt.replace(/^Game\//, '');
  // If the path already starts with a known root directory, use it as-is
  const startsWithRoot = ROOT_DIRS.some(d => clean.startsWith(d));
  if (startsWithRoot) return clean;
  // If it's a known root-level file (e.g. Story.md), it's already correct
  if (ROOT_FILES.includes(clean)) return clean;
  // Otherwise it's a sibling reference — prepend the current file's directory
  if (currentPath) {
    const dir = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
    return dir + clean;
  }
  return clean;
}

function makeFileClickHandler(txt) {
  return function(e) {
    e.preventDefault();
    const resolved = resolvePath(txt);
    const navItem = document.querySelector(`.nav-item[data-path="${resolved}"]`);
    selectFile(resolved, navItem);
  };
}

/* ─── Edit / Save / Cancel ─── */
function enterEdit() {
  if (!currentPath) return;
  isEditing = true;
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('editor').style.display = 'flex';
  document.getElementById('editor-textarea').value = originalContent;
  document.getElementById('btn-edit').style.display = 'none';
  document.getElementById('btn-save').style.display = 'inline-block';
  document.getElementById('btn-cancel').style.display = 'inline-block';
  document.getElementById('edit-status').textContent = '✎ Editing — changes are saved directly to file';
}

function exitEdit() {
  isEditing = false;
  document.getElementById('editor').style.display = 'none';
  document.getElementById('btn-edit').style.display = 'none';
  document.getElementById('btn-save').style.display = 'none';
  document.getElementById('btn-cancel').style.display = 'none';
  document.getElementById('edit-status').textContent = '';
}

function cancelEdit() {
  renderMarkdown(originalContent);
  exitEdit();
  if (currentPath) document.getElementById('btn-edit').style.display = 'inline-block';
}

async function saveFile() {
  if (!currentPath) return;
  const content = document.getElementById('editor-textarea').value;
  try {
    const resp = await fetch(BASE + currentPath, {
      method: 'PUT',
      body: content
    });
    if (!resp.ok && resp.status !== 200) {
      // PUT may not work via static server — try POST with overwrite param
      const resp2 = await fetch(BASE + currentPath + '?overwrite', {
        method: 'POST',
        body: content
      });
      if (!resp2.ok && resp2.status !== 200) throw new Error('PUT and POST both failed');
    }
    originalContent = content;
    renderMarkdown(content);
    exitEdit();
    document.getElementById('btn-edit').style.display = 'inline-block';
    showToast('✅ Saved successfully');
  } catch (e) {
    // Fallback: download as file
    const blob = new Blob([content], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentPath.split('/').pop();
    a.click();
    URL.revokeObjectURL(url);
    originalContent = content;
    renderMarkdown(content);
    exitEdit();
    document.getElementById('btn-edit').style.display = 'inline-block';
    showToast('📥 Downloaded — replace the file manually');
  }
}

/* ─── Toast ─── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ─── Keyboard shortcuts ─── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && isEditing) { cancelEdit(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && isEditing) {
    e.preventDefault(); saveFile();
  }
});

/* ─── Start ─── */
buildNav();
</script>
</body>
</html>
